    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'premium-bg': '#fdfcfb',
              'premium-ink': '#1a1a1a',
              'premium-accent': '#e11d48',
              'premium-muted': '#71717a',
            },
            animation: {
              'fade-in': 'fadeIn 0.5s ease-out',

              }
            }
          }
        }
      }
